name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Force Node.js 24 on runner to avoid the deprecation warning for
# actions/checkout@v4 and actions/setup-python@v5 (Node.js 20 support
# ends 2026-09-16, default switch 2026-06-16).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  # Isolate the bounded runner from legacy runs stuck awaiting cancellation.
  group: ci-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHON_DOTENV_DISABLED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[all]"
          pip install pytest pytest-asyncio
      - name: Run tests
        shell: bash
        # Keep every existing test. A hang fails with captured diagnostics,
        # rather than consuming the six-hour default with no useful report.
        run: |
          mkdir -p ci-artifacts
          # A detached child can keep a tee pipe open after pytest is killed.
          # Write to a regular file so the deadline always reaches upload.
          set +e
          timeout --signal=TERM --kill-after=30s 8m \
            python -u -X faulthandler -c '
          import faulthandler
          import sys

          faulthandler.dump_traceback_later(90, exit=True)

          class CollectionWatchdog:
              def pytest_collection_finish(self, session):
                  faulthandler.cancel_dump_traceback_later()

          import pytest
          raise SystemExit(pytest.main(sys.argv[1:], plugins=[CollectionWatchdog()]))
          ' tests/ -v --ignore=tests/debug_db.py \
            -o faulthandler_timeout=60 --junitxml=ci-artifacts/unit.xml \
            >ci-artifacts/pytest.log 2>&1
          status=$?
          set -e
          tail -n 200 ci-artifacts/pytest.log || true
          exit "$status"
      - name: Upload full-suite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-python-${{ matrix.python-version }}
          path: ci-artifacts/
          retention-days: 7

  browser-layout:
    name: Sandboxed browser layout
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DOCTHINKER_REQUIRE_BROWSER: "1"
      DOCTHINKER_BROWSER_ARTIFACTS: ${{ github.workspace }}/browser-artifacts
      # Ubuntu 24.04 restricts user namespaces for downloaded executables.
      # Install the pinned browser's matching SUID helper in a root-owned path.
      # Keep AppArmor, host sysctls and Chromium's seccomp sandbox intact.
      CHROME_DEVEL_SANDBOX: /usr/local/lib/docthinker/chrome-sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check hosted runner sandbox prerequisites
        run: |
          mkdir -p browser-artifacts
          {
            id
            uname -a
            printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion"
            sysctl kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces
          } | tee browser-artifacts/runner.txt
          test "$(id -u)" -ne 0
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/docthinker-browsers" >> "$GITHUB_ENV"
      - name: Install pinned full Chromium and layout test dependencies
        run: |
          python -m pip install -r .github/browser-requirements.txt
          python -m playwright install --with-deps --no-shell chromium
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.executable_path
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"DOCTHINKER_BROWSER_BIN={browser}\n")
          PY
      - name: Install matching SUID sandbox helper without changing host restrictions
        run: |
          sandbox_source="$(dirname "$DOCTHINKER_BROWSER_BIN")/chrome_sandbox"
          test -f "$sandbox_source"
          sudo install -d -o root -g root -m 0755 /usr/local/lib/docthinker
          sudo install -o root -g root -m 4755 "$sandbox_source" "$CHROME_DEVEL_SANDBOX"
          test "$(stat -Lc '%u:%a' "$CHROME_DEVEL_SANDBOX")" = "0:4755"
          stat -Lc '%u %a %n' "$CHROME_DEVEL_SANDBOX" | tee browser-artifacts/helper.txt
          sha256sum "$CHROME_DEVEL_SANDBOX" | tee -a browser-artifacts/helper.txt
      - name: Record browser version and executable digest
        run: |
          "$DOCTHINKER_BROWSER_BIN" --version | tee browser-artifacts/browser-version.txt
          sha256sum "$DOCTHINKER_BROWSER_BIN" | tee browser-artifacts/browser-sha256.txt
      - name: Run all three real browser viewports with sandbox preflight
        run: >-
          python -m pytest
          tests/test_query_ui_controls_unit.py::test_shell_survives_late_utility_css_in_real_browser
          -v -rA --junitxml=browser-artifacts/layout.xml
      - name: Require three executed, passing layout cases
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("browser-artifacts/layout.xml").findall(".//testcase")
          test = "test_shell_survives_late_utility_css_in_real_browser"
          expected = {f"{test}[{width}]" for width in (390, 768, 1280)}
          assert len(cases) == 3 and {case.get("name") for case in cases} == expected, cases
          assert all(case.find(tag) is None for case in cases
                     for tag in ("skipped", "failure", "error")), "Browser cases must all pass"
          print("Verified sandboxed layout checks passed at 390, 768 and 1280px; zero skips")
          PY
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandboxed-browser-layout
          path: browser-artifacts/
          retention-days: 7
