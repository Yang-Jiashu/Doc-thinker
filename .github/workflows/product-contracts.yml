name: Product contracts

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: product-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/mobile/package-lock.json
      - run: npm ci
      - name: Offline interaction and privacy contracts
        run: npm test
      - name: Production H5 resources
        run: npm run build:h5
      - name: WeChat guest resources (not a published mini-program)
        run: npm run build:mp-weixin
      - name: Native App resources (not a signed installer)
        run: npm run build:app

  invitation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: '1'
      DOCTHINKER_RESEARCH_SEMANTIC: 'off'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: deploy/invite/requirements.txt
      - name: Install restricted runtime (no full parser or training stack)
        run: |
          python -m pip install --require-hashes -r deploy/invite/requirements.txt
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 PyYAML==6.0.3
          python -m pip check
      - name: Authentication, tenant boundaries, feedback and packaging contracts
        run: >-
          python -m pytest -q
          tests/test_answer_feedback_unit.py
          tests/test_sqlite_long_horizon_memory_unit.py
          tests/test_memory_core_unit.py
          tests/test_mobile_contract_unit.py
          tests/test_mobile_safe_startup_unit.py
          tests/test_chat_completion_contract_unit.py
          tests/test_completion_budget_unit.py
          tests/test_goal_evidence_budget_unit.py
          tests/test_goal_evidence_staged_runner_unit.py
          tests/test_gpt5_token_compat_unit.py
          tests/test_invite_app_unit.py
