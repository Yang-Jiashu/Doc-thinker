[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docthinker"
dynamic = ["version"]
authors = [
    {name = "Zirui Guo"}
]
description = "Doc Thinker: document parsing, graph reasoning, and orchestration"
readme = "README.md"
license = { text = "PolyForm-Shield-1.0.0" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "json-repair>=0.30.0",
    "networkx>=3.0",
    "nano-vectordb>=0.0.4.3",
    "tiktoken>=0.7.0",
    "tenacity>=8.0.0",
    "pipmaster>=0.4.0",
    "openai>=1.0.0",
    "huggingface_hub",
    "mineru[core]",
    "shapely>=2.0.0",
    "tqdm",
    "rank-bm25",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "requests>=2.31.0",
]
test = [
    "docthinker[server]",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "faiss-cpu>=1.8.0",
]
image = ["Pillow>=10.0.0"]
text = ["reportlab>=4.0.0"]
office = []  # Requires LibreOffice (external program)
markdown = [
    "markdown>=3.4.0",
    "weasyprint>=60.0",
    "pygments>=2.10.0",
]
all = [
    "docthinker[server]",
    "Pillow>=10.0.0",
    "reportlab>=4.0.0",
    "markdown>=3.4.0",
    "weasyprint>=60.0",
    "pygments>=2.10.0"
]

[project.urls]
Homepage = "https://github.com/Yang-Jiashu/Doc-thinker"
Documentation = "https://github.com/Yang-Jiashu/Doc-thinker"
Repository = "https://github.com/Yang-Jiashu/Doc-thinker"
Issues = "https://github.com/Yang-Jiashu/Doc-thinker/issues"

[tool.uv]
dev-dependencies = [
    "pytest>=6.0",
    "pytest-asyncio",
    "black",
    "isort",
    "flake8",
    "mypy",
    "openai",
    "python-dotenv",
]

[tool.setuptools.packages.find]
include = ["docthinker*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "docthinker.__version__"}

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
