<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Doc Thinker{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        if (window.tailwind) window.tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f6f6f7',
                            100: '#ebebed',
                            500: '#54565b',
                            600: '#323438',
                            700: '#202123',
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="/static/workspace.css?v=2">

    {% block extra_css %}{% endblock %}
</head>
<body class="h-screen overflow-hidden">
    <div class="app-shell">
        <aside class="app-sidebar">
            <div class="app-brand">
                <div class="brand-lockup">
                    <div class="brand-mark" aria-hidden="true">D</div>
                    <div class="brand-wordmark">
                        <h1>DocThinker</h1>
                    </div>
                </div>
            </div>

            <nav class="app-navigation" aria-label="主导航">
                <div class="app-nav-items">

                    <a href="/query" {% if request.endpoint == 'query_page' %}aria-current="page"{% endif %} class="sidebar-item flex items-center gap-3 px-3 py-2.5 text-sm {% if request.endpoint == 'query_page' %}active{% endif %}">
                        <i class="fa-solid fa-comments"></i>
                        对话
                    </a>

                    <a href="/knowledge-graph" {% if request.endpoint in ['knowledge_graph_page', 'kg_viz_page'] %}aria-current="page"{% endif %} class="sidebar-item flex items-center gap-3 px-3 py-2.5 text-sm {% if request.endpoint in ['knowledge_graph_page', 'kg_viz_page'] %}active{% endif %}">
                        <i class="fa-solid fa-circle-nodes"></i>
                        记忆图谱
                    </a>

                    <a href="/config" {% if request.endpoint == 'config_page' %}aria-current="page"{% endif %} class="sidebar-item flex items-center gap-3 px-3 py-2.5 text-sm {% if request.endpoint == 'config_page' %}active{% endif %}">
                        <i class="fa-solid fa-gear"></i>
                        设置
                    </a>
                </div>
            </nav>
            {% block sidebar_content %}{% endblock %}
            <div class="sidebar-footer">证据 · 记忆 · 改进</div>
        </aside>

        <main class="app-main">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2"></div>

    <script>
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            const colors = {
                success: 'bg-[#54746b]',
                error: 'bg-red-500',
                warning: 'bg-[#b7892d]',
                info: 'bg-[#292520]'
            };

            toast.className = `toast ${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2`;
            const icon = document.createElement('i');
            icon.className = `fa-solid ${type === 'success' ? 'fa-check' : type === 'error' ? 'fa-xmark' : 'fa-info-circle'}`;
            icon.setAttribute('aria-hidden', 'true');
            const text = document.createElement('span');
            text.className = 'text-sm';
            text.textContent = String(message ?? '');
            toast.setAttribute('role', type === 'error' ? 'alert' : 'status');
            toast.appendChild(icon);
            toast.appendChild(text);

            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
