<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>选择知识图谱体验 - DocThinker</title>
    <link rel="stylesheet" href="{{ url_for('promo_graph.static', filename='promo_graph.css') }}">
</head>
<body class="promo-chooser-page">
    <canvas id="chooser-particles" aria-hidden="true"></canvas>
    <a class="chooser-back" href="/knowledge-graph" aria-label="返回知识图谱">&larr; 返回图谱</a>
    <main class="chooser-shell">
        <header class="chooser-heading">
            <span>DocThinker Graph Lab</span>
            <h1>选择知识图谱体验</h1>
            <p>同一会话，两种视图。搜索与选中节点随切换保留，摄像头需要另行开启。</p>
        </header>
        <section class="chooser-options" aria-label="知识图谱体验">
            <a class="chooser-option" href="/knowledge-graph">
                <small>01 / CLASSIC</small>
                <strong>标准视图</strong>
                <p>查看重点节点、证据来源与记忆管理，也可开启精准手势。</p>
                <span>进入体验 &rarr;</span>
            </a>
            <a class="chooser-option is-promo" href="/promo-graph">
                <small>02 / GPU STAR MAP</small>
                <strong>沉浸视图</strong>
                <p>全量知识星图，适合大范围浏览、展示和手势探索。</p>
                <span>进入体验 &rarr;</span>
            </a>
        </section>
    </main>
    <script src="{{ url_for('promo_graph.static', filename='chooser.js') }}"></script>
    <script>
      const incoming = new URLSearchParams(location.search);
      document.querySelectorAll('a[href]').forEach(link => {
        const url = new URL(link.getAttribute('href'), location.origin);
        for (const key of ['session_id', 'node', 'search', 'return_view']) {
          if (incoming.has(key)) url.searchParams.set(key, incoming.get(key));
        }
        link.href = url.pathname + url.search;
      });
    </script>
</body>
</html>
